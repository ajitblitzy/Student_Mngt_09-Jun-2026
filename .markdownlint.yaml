# markdownlint configuration — Student Report Generator documentation
#
# This file documents the INTENTIONAL, JUSTIFIED markdownlint exceptions for this
# repository. The documentation set is deliberately citation-dense and table-heavy
# (every technical claim carries an inline `[Readme.md:Lx-Ly]` source citation, and
# fixed parameters / reference data are presented as tables), and the root `Readme.md`
# embeds the application's source (index.html, style.css, script.js) plus an embedded
# README verbatim, which must be preserved byte-for-byte. The rules disabled below
# conflict with those mandatory, intentional choices; every other rule remains active.
#
# Run locally with: markdownlint Readme.md docs/**/*.md

default: true

# MD013 (line-length): Inline source citations of the form `[Readme.md:Lx-Ly]` and the
# mandated reference / parameter tables routinely exceed the default 80-character limit.
# Wrapping them would break citations and tables. Intentionally disabled.
MD013: false

# MD060 (table-column-style): The reference tables use a compact pipe style; enforcing
# uniform cell padding across every mandated table is purely cosmetic and does not affect
# rendering. Intentionally disabled.
MD060: false

# MD025 (single-title/single-h1): The root `Readme.md` embeds the project's source files
# and an embedded README that legitimately contain their own top-level (#) headings. These
# embedded sections must be preserved verbatim, so multiple H1s in `Readme.md` are expected.
# Intentionally disabled.
MD025: false

# MD022 (blanks-around-headings): Fires only on the original, preserved `Readme.md` Overview
# prose. The documentation task must not alter existing `Readme.md` content beyond the added
# Documentation navigation section. Intentionally disabled to honor that preservation rule.
MD022: false

# MD032 (blanks-around-lists): Fires only on the original, preserved `Readme.md` Overview
# prose, for the same preservation reason as MD022 above. Intentionally disabled.
MD032: false

# MD012 (no-multiple-blanks): Fires only on the original, preserved `Readme.md` content near
# end-of-file. Intentionally disabled to honor the `Readme.md` preservation rule.
MD012: false

# MD024 (no-duplicate-heading): The API-reference docs legitimately repeat short subheadings
# (e.g. "Signature") under each distinct function section. `siblings_only` permits this
# standard pattern while still flagging true duplicate sibling headings. Rule stays active.
MD024:
  siblings_only: true
